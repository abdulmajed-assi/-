<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البلد فود - Albalad Food</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-green: #00b074;
            --primary-orange: #ff7010;
            --bg-color: #f8f9fa;
            --text-main: #333333;
            --text-secondary: #717171;
            --border-color: #e5e5e5;
            --white: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); }

        header {
            background-color: var(--white); border-bottom: 1px solid var(--border-color);
            padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000;
        }
        .logo { font-size: 24px; font-weight: 700; color: var(--primary-green); }
        .search-location-bar { display: flex; align-items: center; background: #f1f1f1; border-radius: 8px; padding: 8px 15px; width: 45%; }
        .search-location-bar input { border: none; background: transparent; outline: none; width: 100%; padding: 0 10px; font-size: 14px; }
        .location-btn { background: transparent; border: none; cursor: pointer; color: var(--text-main); font-weight: 600; display: flex; align-items: center; gap: 5px; }

        .auth-buttons { display: flex; gap: 10px; }
        .auth-buttons button { padding: 8px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; }
        .btn-login { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); }
        .btn-register { background: var(--primary-green); border: none; color: var(--white); }

        /* الشريط الأحمر الفارغ وبداخله كوكا كولا */
        .top-red-banner {
            background-color: #d32f2f; height: 160px; margin: 20px 5%; border-radius: 12px;
            display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden;
        }
        .top-red-banner img { height: 140px; object-fit: contain; }
        .banner-dynamic-images { position: absolute; left: 20px; display: flex; gap: 10px; }
        .banner-dynamic-images img { width: 100px; height: 100px; border-radius: 8px; object-fit: cover; border: 2px solid white; }

        .container { display: flex; padding: 0 5%; gap: 30px; }
        sidebar { width: 280px; background: var(--white); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); height: fit-content; }
        .filter-group { margin-bottom: 20px; }
        .filter-group label { display: block; font-size: 14px; color: var(--text-secondary); margin-bottom: 8px; cursor: pointer; }
        .filter-group select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); margin-top: 5px; }
        
        main { flex: 1; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .section-header h2 { font-size: 20px; font-weight: 700; }
        .see-all { color: var(--primary-green); font-weight: 600; cursor: pointer; font-size: 14px; text-decoration: none; }

        /* قسم عروض Kampanyalar */
        .kampanyalar-slider { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 15px; scrollbar-width: none; margin-bottom: 30px; }
        .kampanyalar-slider::-webkit-scrollbar { display: none; }
        .kampanya-card { min-width: 260px; height: 150px; background: white; border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); position: relative; }
        .kampanya-card img { width: 100%; height: 100%; object-fit: cover; }

        /* أقسام الطعام الدائرية */
        .mutfaklar-wrapper { position: relative; display: flex; align-items: center; margin-bottom: 30px; }
        .mutfaklar-slider { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; width: 100%; }
        .mutfaklar-slider::-webkit-scrollbar { display: none; }
        .mutfak-item { text-align: center; min-width: 90px; cursor: pointer; }
        .mutfak-item img { width: 85px; height: 85px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border-color); }
        .mutfak-item p { font-size: 13px; margin-top: 8px; font-weight: 600; }

        /* شبكة المطاعم */
        .restoranlar-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .restoran-card { background: var(--white); border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); cursor: pointer; transition: 0.3s; }
        .restoran-card:hover { box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        .restoran-img-container { position: relative; height: 160px; }
        .restoran-img-container img { width: 100%; height: 100%; object-fit: cover; }
        .restoran-info { padding: 15px; }
        .restoran-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .restoran-name { font-weight: 700; font-size: 16px; }
        .restoran-rating { background: #e8f5e9; color: var(--primary-green); padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; }
        .restoran-details { font-size: 12px; color: var(--text-secondary); display: flex; flex-direction: column; gap: 4px; }

        /* النوافذ المنبثقة */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 3000; justify-content: center; align-items: center; }
        .modal-box { background: white; padding: 30px; border-radius: 12px; width: 400px; text-align: center; position: relative; }
        .modal-box input, .modal-box select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; }
        .btn-main { background: var(--primary-green); color: white; border: none; padding: 10px; border-radius: 6px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .close-btn { position: absolute; top: 15px; left: 15px; background: none; border: none; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="logo">البلد فود</div>
        <div class="search-location-bar">
            <i class="fa-solid fa-location-dot" style="color: var(--primary-orange);"></i>
            <button class="location-btn" onclick="openLocationModal()">حدد موقعك <i class="fa-solid fa-chevron-down" style="font-size: 10px;"></i></button>
            <input type="text" placeholder="ابحث عن مطعم أو وجبة...">
        </div>
        <div class="auth-buttons">
            <button class="btn-login" onclick="openModal('loginModal')"><i class="fa-solid fa-user"></i> تسجيل الدخول</button>
            <button class="btn-register" onclick="location.href='admin.html'"><i class="fa-solid fa-lock"></i> لوحة الأدمن</button>
        </div>
    </header>

    <!-- الشريط الأحمر الفارغ وبداخله كوكا كولا -->
    <div class="top-red-banner">
        <img src="https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=300" alt="كوكا كولا">
        <div class="banner-dynamic-images" id="adminBannerImages">
            <!-- صور إضافية يضيفها الأدمن تظهر هنا -->
        </div>
    </div>

    <div class="container">
        <!-- الفلتر المطور حسب المدن السورية -->
        <sidebar>
            <h3>فلتر و ترتيب</h3>
            <div class="filter-group">
                <label><strong>المدينة</strong></label>
                <select id="cityFilter">
                    <option value="">اختر المدينة</option>
                    <option>دمشق</option>
                    <option>ريف دمشق</option>
                    <option>حمص</option>
                    <option>اللاذقية</option>
                    <option>حلب</option>
                    <option>دير الزور</option>
                </select>
            </div>
            <div class="filter-group">
                <label><strong>المحافظة / المنطقة</strong></label>
                <input type="text" class="filter-group" placeholder="أدخل المنطقة..." style="width:100%; padding:8px; border:1px solid #ccc; border-radius:6px;">
            </div>
            <div class="filter-group">
                <label><strong>قسم الطعام</strong></label>
                <select id="catFilter">
                    <option value="">جميع الأقسام</option>
                    <option>شاورما</option>
                    <option>بروستد</option>
                    <option>سندويش غربي</option>
                    <option>فلافل</option>
                    <option>حلويات</option>
                    <option>مندي</option>
                    <option>برغر</option>
                    <option>بيتزا</option>
                    <option>كوكتيل</option>
                </select>
            </div>
            <div class="filter-group">
                <label><strong>السعر</strong></label>
                <select>
                    <option>من الأقل للأعلى</option>
                    <option>من الأعلى للأقل</option>
                </select>
            </div>
        </sidebar>

        <main>
            <!-- قسم عروض Kampanyalar -->
            <div class="section-header">
                <h2>Kampanyalar (العروض)</h2>
                <a href="#" class="see-all">Tümünü Gör</a>
            </div>
            <div class="kampanyalar-slider" id="kampanyalarContainer">
                <div class="kampanya-card"><img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=400"></div>
                <div class="kampanya-card"><img src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=400"></div>
                <div class="kampanya-card"><img src="https://images.unsplash.com/photo-1540420773420-3366772f4999?w=400"></div>
            </div>

            <!-- أقسام الطعام الدائرية -->
            <div class="section-header">
                <h2>أقسام الطعام</h2>
            </div>
            <div class="mutfaklar-wrapper">
                <div class="mutfaklar-slider">
                    <div class="mutfak-item"><img src="https://images.unsplash.com/photo-1529042410759-befb1204b468?w=150"><p>شاورما</p></div>
                    <div class="mutfak-item"><img src="https://images.unsplash.com/photo-1626777552726-4a6b54c97e46?w=150"><p>بروستد</p></div>
                    <div class="mutfak-item"><img src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=150"><p>سندويش غربي</p></div>
                    <div class="mutfak-item"><img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=150"><p>فلافل</p></div>
                    <div class="mutfak-item"><img src="https://images.unsplash.com/photo-1551024709-8f23befc6f87?w=150"><p>حلويات</p></div>
                    <div class="mutfak-item"><img src="https://images.unsplash.com/photo-1633964913295-ceb43826e7c9?w=150"><p>مندي</p></div>
                    <div class="mutfak-item"><img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=150"><p>برغر</p></div>
                    <div class="mutfak-item"><img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=150"><p>بيتزا</p></div>
                    <div class="mutfak-item"><img src="https://images.unsplash.com/photo-1551024709-8f23befc6f87?w=150"><p>كوكتيل</p></div>
                </div>
            </div>

            <!-- قسم كل المطاعم بدون رقم 1519 -->
            <div class="section-header">
                <h2>كل المطاعم (<span id="restCount">1</span>)</h2>
            </div>
            <div class="restoranlar-grid" id="restaurantsContainer">
                <div class="restoran-card">
                    <div class="restoran-img-container">
                        <img src="https://images.unsplash.com/photo-1550547660-d9450f859349?w=400">
                    </div>
                    <div class="restoran-info">
                        <div class="restoran-title-row">
                            <span class="restoran-name">مطعم الشام الأصيل</span>
                            <span class="restoran-rating">4.8 ⭐</span>
                        </div>
                        <div class="restoran-details">
                            <span><i class="fa-solid fa-utensils"></i> شاورما ومشاوي</span>
                            <span><i class="fa-solid fa-location-dot"></i> دمشق - المزة</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- نافذة تسجيل الدخول -->
    <div id="loginModal" class="modal-overlay">
        <div class="modal-box">
            <button class="close-btn" onclick="closeModal('loginModal')"><i class="fa-solid fa-xmark"></i></button>
            <h3>تسجيل الدخول</h3>
            <input type="text" placeholder="الاسم الأول">
            <input type="text" placeholder="الكنية">
            <div style="display: flex; gap: 5px;">
                <select style="width: 90px;"><option>+963</option><option>+90</option></select>
                <input type="text" placeholder="رقم الهاتف">
            </div>
            <button class="btn-main" onclick="closeModal('loginModal'); alert('تم تسجيل الدخول وتفعيل خاصية التقييم!');">دخول</button>
        </div>
    </div>

    <script>
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function openLocationModal() { alert('حدد موقعك'); }
    </script>
</body>
</html>
