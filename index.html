<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>البلد فود - Albalad Food</title>
    <meta name="description"
          content="تصفح المطاعم وأقسام الطعام والعروض على البلد فود.">

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --primary-green: #008857;
            --primary-orange: #ff7010;
            --bg-color: #f8f9fa;
            --text-main: #333333;
            --text-secondary: #626262;
            --border-color: #e5e5e5;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body,
        input,
        select,
        button {
            font-family: "Cairo", sans-serif;
        }

        body {
            background: var(--bg-color);
            color: var(--text-main);
        }

        [hidden] {
            display: none !important;
        }

        button,
        select {
            cursor: pointer;
        }

        button {
            color: inherit;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        :focus-visible {
            outline: 3px solid var(--primary-green);
            outline-offset: 3px;
        }

        header {
            background: var(--white);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-green);
            white-space: nowrap;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: #f1f1f1;
            border-radius: 8px;
            padding: 8px 15px;
            width: 45%;
            min-width: 0;
        }

        .search-bar input {
            border: none;
            background: transparent;
            width: 100%;
            min-width: 0;
            padding: 0 10px;
            font-size: 14px;
            color: var(--text-main);
        }

        .auth-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .auth-buttons button {
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
        }

        .btn-visitor {
            background: var(--white);
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .btn-merchant {
            background: var(--primary-green);
            border: 1px solid var(--primary-green);
            color: var(--white);
        }

        .top-red-banner {
            background: #d32f2f;
            min-height: 160px;
            margin: 20px 5%;
            padding: 10px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .top-red-banner img {
            display: block;
            height: 140px;
            max-width: 100%;
            object-fit: contain;
        }

        .container {
            display: flex;
            padding: 0 5%;
            gap: 30px;
            align-items: flex-start;
        }

        sidebar {
            display: block;
            flex: 0 0 280px;
            width: 280px;
            background: var(--white);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .filter-group {
            margin-top: 12px;
        }

        .filter-group label {
            display: block;
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .filter-group select {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--white);
        }

        main {
            flex: 1;
            min-width: 0;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .section-header h2 {
            font-size: 20px;
            font-weight: 700;
        }

        .see-all {
            color: var(--primary-green);
            background: transparent;
            border: none;
            padding: 8px;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
        }

        .kampanyalar-slider {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }

        .kampanyalar-slider.expanded {
            flex-wrap: wrap;
        }

        .kampanya-card {
            flex: 0 0 280px;
            max-width: 100%;
            background: var(--white);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .kampanya-card img {
            display: block;
            width: 100%;
            height: 120px;
            object-fit: cover;
        }

        .kampanya-card p {
            padding: 8px;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .mutfaklar-slider {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        .mutfak-item {
            text-align: center;
            min-width: 80px;
            flex-shrink: 0;
            background: transparent;
            border: none;
            padding: 4px;
        }

        .mutfak-item img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border-color);
        }

        .mutfak-item p {
            font-size: 12px;
            margin-top: 6px;
            font-weight: 600;
        }

        .mutfak-item[aria-pressed="true"] {
            background: #dff5e9;
            border-radius: 10px;
        }

        .food-icon {
            display: grid;
            place-items: center;
            width: 70px;
            height: 70px;
            margin: auto;
            border-radius: 50%;
            background: #e8f4ed;
            font-size: 32px;
        }

        .restoranlar-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fill, minmax(min(100%, 280px), 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .restoran-card {
            background: var(--white);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .restoran-img-container {
            height: 160px;
        }

        .restoran-img-container img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .restoran-info {
            padding: 15px;
            overflow-wrap: anywhere;
        }

        .restoran-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
        }

        .restoran-name {
            font-weight: 700;
            font-size: 16px;
        }

        .restoran-details {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .rating {
            color: var(--primary-green);
            font-weight: 700;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 3000;
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background: var(--white);
            padding: 30px;
            border-radius: 12px;
            width: min(400px, calc(100% - 24px));
            max-height: calc(100dvh - 24px);
            overflow-y: auto;
            text-align: center;
            position: relative;
        }

        .modal-box h3 {
            padding-inline: 20px;
        }

        .modal-box label {
            display: block;
            text-align: start;
            margin-top: 10px;
        }

        .modal-box input,
        .modal-box select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #cccccc;
            border-radius: 6px;
        }

        .btn-main {
            background: var(--primary-green);
            color: var(--white);
            border: none;
            padding: 10px;
            border-radius: 6px;
            width: 100%;
            font-weight: 700;
            margin-top: 10px;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: none;
            border: none;
            font-size: 18px;
            padding: 4px;
        }

        .notice {
            padding: 12px;
            margin: 12px 0;
            background: #fff5db;
            border: 1px solid #d6bc79;
            border-radius: 8px;
            overflow-wrap: anywhere;
        }

        .global-notice,
        #startupStatus {
            margin: 12px 5%;
        }

        @media (max-width: 760px) {
            header {
                flex-wrap: wrap;
                gap: 12px;
                padding: 12px 4%;
                position: static;
            }

            .logo {
                font-size: 21px;
            }

            .search-bar {
                order: 3;
                width: 100%;
            }

            .auth-buttons {
                gap: 6px;
            }

            .auth-buttons button {
                padding: 8px;
            }

            .container {
                flex-direction: column;
                padding: 0 4%;
                gap: 16px;
            }

            sidebar {
                width: 100%;
                flex: auto;
            }

            main {
                width: 100%;
            }

            .top-red-banner {
                margin: 16px 4%;
            }

            .kampanya-card {
                flex-basis: min(280px, 100%);
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">البلد فود</div>

        <div class="search-bar" role="search">
            <span aria-hidden="true">⌕</span>
            <input
                type="search"
                aria-label="ابحث عن مطعم أو وجبة"
                placeholder="ابحث عن مطعم أو وجبة..."
            >
        </div>

        <div class="auth-buttons">
            <button type="button" class="btn-visitor">
                حساب زائر
            </button>

            <button type="button" class="btn-merchant">
                حساب تاجر
            </button>
        </div>
    </header>

    <p id="startupStatus" class="notice" role="status">
        جارٍ تشغيل البحث وتسجيل الدخول…
    </p>

    <noscript>
        <p class="notice global-notice">
            يرجى تفعيل JavaScript لاستخدام البحث وتسجيل الدخول وعرض التحديثات.
        </p>
    </noscript>

    <div class="top-red-banner">
        <img
            src="https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=300"
            alt="كوكا كولا"
            width="210"
            height="140"
        >
    </div>

    <div class="container">
        <sidebar role="complementary" aria-label="تصفية المطاعم">
            <h3>تصفية المطاعم</h3>

            <div class="filter-group">
                <label for="cityFilter">
                    <strong>المدينة</strong>
                </label>

                <select id="cityFilter">
                    <option value="">جميع المدن</option>
                    <option value="دمشق">دمشق</option>
                    <option value="ريف دمشق">ريف دمشق</option>
                    <option value="حمص">حمص</option>
                    <option value="اللاذقية">اللاذقية</option>
                    <option value="حلب">حلب</option>
                    <option value="دير الزور">دير الزور</option>
                </select>
            </div>
        </sidebar>

        <main>
            <div class="section-header">
                <h2>العروض</h2>
                <button type="button" class="see-all">
                    عرض الكل
                </button>
            </div>

            <div class="kampanyalar-slider" id="homeOffersContainer">
                <div class="kampanya-card">
                    <img
                        src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=400"
                        alt="وجبات متنوعة"
                        loading="lazy"
                    >
                    <p>عرض العائلة المميز</p>
                </div>
            </div>

            <div class="section-header">
                <h2>أقسام الطعام</h2>
            </div>

            <div class="mutfaklar-slider" id="homeFoodContainer">
                <div class="mutfak-item">
                    <span class="food-icon" aria-hidden="true">🌯</span>
                    <p>شاورما</p>
                </div>

                <div class="mutfak-item">
                    <span class="food-icon" aria-hidden="true">🍗</span>
                    <p>بروستد</p>
                </div>

                <div class="mutfak-item">
                    <span class="food-icon" aria-hidden="true">🥪</span>
                    <p>سندويش غربي</p>
                </div>

                <div class="mutfak-item">
                    <span class="food-icon" aria-hidden="true">🧆</span>
                    <p>فلافل</p>
                </div>

                <div class="mutfak-item">
                    <span class="food-icon" aria-hidden="true">🍚</span>
                    <p>مندي</p>
                </div>

                <div class="mutfak-item">
                    <span class="food-icon" aria-hidden="true">🍔</span>
                    <p>برغر</p>
                </div>

                <div class="mutfak-item">
                    <span class="food-icon" aria-hidden="true">🥤</span>
                    <p>كوكتيل</p>
                </div>

                <div class="mutfak-item">
                    <span class="food-icon" aria-hidden="true">🍰</span>
                    <p>حلويات</p>
                </div>
            </div>

            <div class="section-header">
                <h2>كل المطاعم</h2>
            </div>

            <div class="restoranlar-grid" id="homeRestaurantsContainer">
                <article class="restoran-card">
                    <div class="restoran-img-container">
                        <img
                            src="https://images.unsplash.com/photo-1550547660-d9450f859349?w=400"
                            alt="وجبة من المطعم"
                            loading="lazy"
                        >
                    </div>

                    <div class="restoran-info">
                        <div class="restoran-title-row">
                            <h3 class="restoran-name">
                                مطعم الشام الأصيل
                            </h3>

                            <span class="rating">4.8 ⭐</span>
                        </div>

                        <p class="restoran-details">
                            دمشق - المزة | شاورما ومشاوي
                        </p>
                    </div>
                </article>
            </div>
        </main>
    </div>

    <div
        id="visitorModal"
        class="modal-overlay"
        role="dialog"
        aria-modal="true"
        aria-labelledby="visitorModalTitle"
    >
        <div class="modal-box">
            <h3 id="visitorModalTitle">حساب الزائر</h3>
        </div>
    </div>

    <div
        id="merchantModal"
        class="modal-overlay"
        role="dialog"
        aria-modal="true"
        aria-labelledby="merchantModalTitle"
    >
        <div class="modal-box">
            <h3 id="merchantModalTitle">حساب التاجر</h3>
        </div>
    </div>

    <script>
        const startupStatus = document.getElementById("startupStatus");

        import("./site.js")
            .then(function () {
                startupStatus.remove();
            })
            .catch(function (error) {
                console.error(
                    "Site başlatılamadı:",
                    error.code || error.name
                );

                startupStatus.textContent =
                    "تعذر تشغيل الموقع. تحقق من وجود ملف site.js واتصال الإنترنت، ثم أعد تحميل الصفحة.";

                startupStatus.setAttribute("role", "alert");
            });
    </script>
</body>
</html>
