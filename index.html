<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البلد فود - Albalad Food</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-green: #00b074;
            --primary-orange: #ff7010;
            --bg-color: #f8f9fa;
            --text-main: #333333;
            --text-secondary: #717171;
            --border-color: #e5e5e5;
            --white: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); }

        header {
            background-color: var(--white); border-bottom: 1px solid var(--border-color);
            padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000;
        }
        .logo { font-size: 24px; font-weight: 700; color: var(--primary-green); }
        .search-bar { display: flex; align-items: center; background: #f1f1f1; border-radius: 8px; padding: 8px 15px; width: 45%; }
        .search-bar input { border: none; background: transparent; outline: none; width: 100%; padding: 0 10px; font-size: 14px; }

        .auth-buttons { display: flex; gap: 10px; }
        .auth-buttons button { padding: 8px 15px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; }
        .btn-visitor { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); }
        .btn-merchant { background: var(--primary-green); border: none; color: var(--white); }

        .top-red-banner {
            background-color: #d32f2f; height: 160px; margin: 20px 5%; border-radius: 12px;
            display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden;
        }
        .top-red-banner img { height: 140px; object-fit: contain; }

        .container { display: flex; padding: 0 5%; gap: 30px; }
        sidebar { width: 280px; background: var(--white); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); height: fit-content; }
        .filter-group { margin-bottom: 20px; }
        .filter-group label { display: block; font-size: 14px; color: var(--text-secondary); margin-bottom: 8px; }
        .filter-group select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); margin-top: 5px; }
        
        main { flex: 1; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .section-header h2 { font-size: 20px; font-weight: 700; }
        .see-all { color: var(--primary-green); font-weight: 600; cursor: pointer; font-size: 14px; text-decoration: none; }

        /* قسم العروض */
        .kampanyalar-slider { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 15px; scrollbar-width: none; margin-bottom: 30px; }
        .kampanyalar-slider::-webkit-scrollbar { display: none; }
        .kampanya-card { min-width: 280px; height: 160px; background: white; border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .kampanya-card img { width: 100%; height: 120px; object-fit: cover; }
        .kampanya-card p { padding: 8px; font-size: 13px; font-weight: bold; text-align: center; }

        /* أقسام الطعام */
        .mutfaklar-slider { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; margin-bottom: 30px; }
        .mutfaklar-slider::-webkit-scrollbar { display: none; }
        .mutfak-item { text-align: center; min-width: 80px; cursor: pointer; }
        .mutfak-item img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border-color); }
        .mutfak-item p { font-size: 12px; margin-top: 6px; font-weight: 600; }

        .restoranlar-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .restoran-card { background: var(--white); border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); }
        .restoran-img-container { position: relative; height: 160px; }
        .restoran-img-container img { width: 100%; height: 100%; object-fit: cover; }
        .restoran-info { padding: 15px; }
        .restoran-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .restoran-name { font-weight: 700; font-size: 16px; }
        .restoran-details { font-size: 12px; color: var(--text-secondary); }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 3000; justify-content: center; align-items: center; }
        .modal-box { background: white; padding: 30px; border-radius: 12px; width: 400px; text-align: center; position: relative; }
        .modal-box input, .modal-box select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; }
        .btn-main { background: var(--primary-green); color: white; border: none; padding: 10px; border-radius: 6px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .close-btn { position: absolute; top: 15px; left: 15px; background: none; border: none; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="logo">البلد فود</div>
        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass" style="color: var(--text-secondary);"></i>
            <input type="text" placeholder="ابحث عن مطعم أو وجبة...">
        </div>
        <div class="auth-buttons">
            <button class="btn-visitor" onclick="openModal('visitorModal')"><i class="fa-solid fa-user"></i> حساب زائر</button>
            <button class="btn-merchant" onclick="openModal('merchantModal')"><i class="fa-solid fa-store"></i> حساب تاجر</button>
        </div>
    </header>

    <div class="top-red-banner">
        <img src="https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=300" alt="كوكا كولا">
    </div>

    <div class="container">
        <sidebar>
            <h3>فلتر و ترتيب</h3>
            <div class="filter-group">
                <label><strong>المدينة</strong></label>
                <select>
                    <option value="">اختر المدينة</option>
                    <option>دمشق</option><option>ريف دمشق</option><option>حمص</option>
                    <option>اللاذقية</option><option>حلب</option><option>دير الزور</option>
                </select>
            </div>
        </sidebar>

        <main>
            <!-- قسم العروض (يتم جلبها ديناميكياً من الأدمن) -->
            <div class="section-header">
                <h2>العروض</h2>
                <a href="#" class="see-all">عرض الكل</a>
            </div>
            <div class="kampanyalar-slider" id="homeOffersContainer">
                <!-- عرض افتراضي أولوي -->
                <div class="kampanya-card">
                    <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=400">
                    <p>عرض العائلة المميز</p>
                </div>
            </div>

            <!-- قسم أقسام الطعام (يتم جلبها ديناميكياً) -->
            <div class="section-header">
                <h2>أقسام الطعام</h2>
            </div>
            <div class="mutfaklar-slider" id="homeFoodContainer">
                <div class="mutfak-item"><img src="https://images.unsplash.com/photo-1529042410759-befb1204b468?w=150"><p>شاورما</p></div>
                <div class="mutfak-item"><img src="https://images.unsplash.com/photo-1626777552726-4a6b54c97e46?w=150"><p>بروستد</p></div>
                <div class="mutfak-item"><img src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=150"><p>سندويش غربي</p></div>
                <div class="mutfak-item"><img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=150"><p>فلافل</p></div>
                <div class="mutfak-item"><img src="https://images.unsplash.com/photo-1633964913295-ceb43826e7c9?w=150"><p>مندي</p></div>
                <div class="mutfak-item"><img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=150"><p>برغر</p></div>
                <div class="mutfak-item"><img src="https://images.unsplash.com/photo-1551024709-8f23befc6f87?w=150"><p>كوكتيل</p></div>
                <div class="mutfak-item"><img src="https://images.unsplash.com/photo-1551024709-8f23befc6f87?w=150"><p>حلويات</p></div>
            </div>

            <!-- كل المطاعم -->
            <div class="section-header">
                <h2>كل المطاعم</h2>
            </div>
            <div class="restoranlar-grid" id="homeRestaurantsContainer">
                <div class="restoran-card">
                    <div class="restoran-img-container">
                        <img src="https://images.unsplash.com/photo-1550547660-d9450f859349?w=400">
                    </div>
                    <div class="restoran-info">
                        <div class="restoran-title-row">
                            <span class="restoran-name">مطعم الشام الأصيل</span>
                            <span style="color:var(--primary-green); font-weight:bold;">4.8 ⭐</span>
                        </div>
                        <div class="restoran-details">دمشق - المزة | شاورما ومشاوي</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- نافذة تسجيل الدخول -->
    <div id="visitorModal" class="modal-overlay">
        <div class="modal-box">
            <button class="close-btn" onclick="closeModal('visitorModal')"><i class="fa-solid fa-xmark"></i></button>
            <h3>تسجيل حساب زائر</h3>
            <input type="text" placeholder="الاسم">
            <input type="text" placeholder="الكنية">
            <input type="text" placeholder="رقم الهاتف">
            <button class="btn-main" onclick="closeModal('visitorModal'); alert('تم تسجيل الدخول بنجاح!');">تسجيل ودخول</button>
        </div>
    </div>

    <div id="merchantModal" class="modal-overlay">
        <div class="modal-box">
            <button class="close-btn" onclick="closeModal('merchantModal')"><i class="fa-solid fa-xmark"></i></button>
            <h3>تسجيل دخول تاجر</h3>
            <input type="text" placeholder="اسم المستخدم">
            <input type="password" placeholder="كلمة السر">
            <button class="btn-main" onclick="alert('تم تسجيل الدخول بنجاح')">دخول</button>
        </div>
    </div>

    <script>
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // تحميل العروض وأقسام الطعام والمطاعم المخزنة من لوحة الأدمن تلقائياً
        window.onload = function() {
            let savedOffers = JSON.parse(localStorage.getItem('admin_offers')) || [];
            let offersContainer = document.getElementById('homeOffersContainer');
            savedOffers.forEach(offer => {
                offersContainer.innerHTML += `
                    <div class="kampanya-card">
                        <img src="${offer.img}" alt="${offer.title}">
                        <p>${offer.title}</p>
                    </div>
                `;
            });

            let savedFoods = JSON.parse(localStorage.getItem('admin_foods')) || [];
            let foodContainer = document.getElementById('homeFoodContainer');
            savedFoods.forEach(food => {
                foodContainer.innerHTML += `
                    <div class="mutfak-item">
                        <img src="${food.img}" alt="${food.name}">
                        <p>${food.name}</p>
                    </div>
                `;
            });
        };
    </script>
</body>
</html>
