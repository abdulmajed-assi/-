<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البلد فود - Albalad Food</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-green: #00b074;
            --primary-orange: #ff7010;
            --bg-color: #f8f9fa;
            --text-main: #333333;
            --text-secondary: #717171;
            --border-color: #e5e5e5;
            --white: #ffffff;
            --danger: #d32f2f;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); }

        header {
            background-color: var(--white); border-bottom: 1px solid var(--border-color);
            padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000;
        }
        .logo { font-size: 24px; font-weight: 700; color: var(--primary-green); }
        .search-bar { display: flex; align-items: center; background: #f1f1f1; border-radius: 8px; padding: 8px 15px; width: 50%; }
        .search-bar input { border: none; background: transparent; outline: none; width: 100%; padding: 0 10px; font-size: 14px; }

        .auth-buttons { display: flex; gap: 10px; }
        .auth-buttons button { padding: 8px 15px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; }
        .btn-visitor { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); }
        .btn-merchant { background: var(--primary-green); border: none; color: var(--white); }

        /* الشريط الأحمر العلوي */
        .top-red-banner {
            background-color: #d32f2f; height: 160px; margin: 20px 5%; border-radius: 12px;
            display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden;
        }
        .top-red-banner img { height: 140px; object-fit: contain; }

        .container { display: flex; padding: 0 5%; gap: 30px; }
        sidebar { width: 280px; background: var(--white); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); height: fit-content; }
        .filter-group { margin-bottom: 20px; }
        .filter-group label { display: block; font-size: 14px; color: var(--text-secondary); margin-bottom: 8px; }
        .filter-group select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); margin-top: 5px; }
        
        main { flex: 1; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .section-header h2 { font-size: 20px; font-weight: 700; }

        /* شبكة العروض وأقسام الطعام والمطاعم */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card-item { background: white; border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); position: relative; }
        .card-item img { width: 100%; height: 150px; object-fit: cover; }
        .card-body { padding: 15px; }
        .card-title { font-weight: 700; font-size: 16px; margin-bottom: 5px; }
        .card-desc { font-size: 12px; color: var(--text-secondary); margin-bottom: 10px; }
        
        /* النوافذ المنبثقة */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 3000; justify-content: center; align-items: center; }
        .modal-box { background: white; padding: 30px; border-radius: 12px; width: 400px; text-align: center; position: relative; }
        .modal-box input, .modal-box select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; }
        .btn-main { background: var(--primary-green); color: white; border: none; padding: 10px; border-radius: 6px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .close-btn { position: absolute; top: 15px; left: 15px; background: none; border: none; font-size: 16px; cursor: pointer; }
        .whatsapp-contact { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: #25d366; color: white; padding: 10px; border-radius: 6px; text-decoration: none; font-weight: bold; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">البلد فود</div>
        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass" style="color: var(--text-secondary);"></i>
            <input type="text" placeholder="ابحث عن مطعم أو وجبة...">
        </div>
        <div class="auth-buttons">
            <button class="btn-visitor" onclick="openModal('visitorModal')"><i class="fa-solid fa-user"></i> حساب زائر</button>
            <button class="btn-merchant" onclick="openModal('merchantModal')"><i class="fa-solid fa-store"></i> حساب تاجر</button>
            <button class="btn-merchant" style="background:#333;" onclick="location.href='admin.html'"><i class="fa-solid fa-lock"></i> لوحة الأدمن</button>
        </div>
    </header>

    <!-- الشريط الأحمر العلوي -->
    <div class="top-red-banner">
        <img src="https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=300" alt="كوكا كولا">
    </div>

    <div class="container">
        <!-- الفلتر الجانبي -->
        <sidebar>
            <h3>فلتر و ترتيب</h3>
            <div class="filter-group">
                <label><strong>المدينة</strong></label>
                <select>
                    <option value="">اختر المدينة</option>
                    <option>دمشق</option><option>ريف دمشق</option><option>حمص</option>
                    <option>اللاذقية</option><option>حلب</option><option>دير الزور</option>
                </select>
            </div>
            <div class="filter-group">
                <label><strong>قسم الطعام</strong></label>
                <select>
                    <option value="">جميع الأقسام</option>
                    <option>شاورما</option><option>بروستد</option><option>برغر</option><option>بيتزا</option>
                </select>
            </div>
        </sidebar>

        <main>
            <!-- قسم العروض -->
            <div class="section-header">
                <h2>العروض</h2>
            </div>
            <div class="grid-container" id="mainOffersContainer">
                <div class="card-item">
                    <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=400">
                    <div class="card-body">
                        <div class="card-title">عرض العائلة المميز</div>
                        <div class="card-desc">خصم 25% على الوجبات السريعة لفترة محدودة.</div>
                    </div>
                </div>
            </div>

            <!-- قسم المطاعم -->
            <div class="section-header">
                <h2>كل المطاعم</h2>
            </div>
            <div class="grid-container" id="mainRestaurantsContainer">
                <div class="card-item">
                    <img src="https://images.unsplash.com/photo-1550547660-d9450f859349?w=400">
                    <div class="card-body">
                        <div class="card-title">مطعم الشام الأصيل</div>
                        <div class="card-desc">دمشق - المزة | أشهى وجبات الشاورما والمشاوي الطازجة.</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- نافذة حساب زائر -->
    <div id="visitorModal" class="modal-overlay">
        <div class="modal-box">
            <button class="close-btn" onclick="closeModal('visitorModal')"><i class="fa-solid fa-xmark"></i></button>
            <h3>تسجيل حساب زائر</h3>
            <input type="text" placeholder="الاسم">
            <input type="text" placeholder="الكنية">
            <div style="display: flex; gap: 5px;">
                <select style="width: 90px;"><option>+963</option><option>+90</option></select>
                <input type="text" placeholder="رقم الهاتف">
            </div>
            <button class="btn-main" onclick="closeModal('visitorModal'); alert('تم تسجيل الدخول بنجاح وتفعيل التقييم!');">تسجيل ودخول</button>
        </div>
    </div>

    <!-- نافذة حساب تاجر -->
    <div id="merchantModal" class="modal-overlay">
        <div class="modal-box">
            <button class="close-btn" onclick="closeModal('merchantModal')"><i class="fa-solid fa-xmark"></i></button>
            <h3>تسجيل دخول تاجر</h3>
            <input type="text" placeholder="اسم المستخدم">
            <input type="password" placeholder="كلمة السر">
            <button class="btn-main" onclick="location.href='admin.html'">تسجيل الدخول</button>
            <p style="font-size: 13px; color: var(--text-secondary); margin-top: 15px;">لا يوجد حساب؟ تواصل مع رقم الإدارة</p>
            <a href="https://wa.me/+905052077638" target="_blank" class="whatsapp-contact">
                <i class="fa-brands fa-whatsapp" style="font-size: 18px;"></i> تواصل عبر الواتساب مع الإدارة
            </a>
        </div>
    </div>

    <script>
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    </script>
</body>
</html>
