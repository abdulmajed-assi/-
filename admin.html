<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الشاملة - البلد فود</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary-green: #00b074; --bg-color: #f8f9fa; --white: #ffffff; --text-main: #333333; --danger: #d32f2f; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); }

        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .login-box { background: var(--white); padding: 30px; border-radius: 12px; width: 350px; text-align: center; }
        .login-box input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; }
        .login-box button { width: 100%; padding: 10px; background: var(--primary-green); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }

        .admin-container { padding: 30px 5%; display: none; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .admin-card { background: var(--white); padding: 20px; border-radius: 10px; border: 1px solid #e5e5e5; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .admin-card h3 { margin-bottom: 15px; color: var(--primary-green); font-size: 18px; border-bottom: 2px solid #eee; padding-bottom: 8px; }
        .form-control { width: 100%; padding: 9px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .btn-action { background: #333; color: white; border: none; padding: 9px 15px; border-radius: 6px; cursor: pointer; margin-top: 5px; font-weight: bold; width: 100%; }
        .btn-green { background: var(--primary-green); }
        .btn-danger { background: var(--danger); }
        .merchant-row { background: #f9f9f9; padding: 10px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #e5e5e5; font-size: 13px; }
    </style>
</head>
<body>

    <!-- نافذة تسجيل دخول الأدمن -->
    <div id="loginOverlay">
        <div class="login-box">
            <h2>تسجيل دخول الأدمن</h2>
            <p style="font-size: 12px; color: #777; margin: 10px 0;">اسم المستخدم: Jonathan | كلمة المرور: 123</p>
            <input type="text" id="adminUser" placeholder="اسم المستخدم">
            <input type="password" id="adminPass" placeholder="كلمة المرور">
            <button onclick="checkLogin()">دخول لوحة التحكم</button>
        </div>
    </div>

    <!-- لوحة التحكم -->
    <div class="admin-container" id="adminPanel">
        <div class="admin-header">
            <h2>لوحة تحكم الأدمن (Jonathan)</h2>
            <button class="btn-action" style="width: auto; background:#2196F3;" onclick="location.href='index.html'">معاينة الموقع الرئيسي</button>
        </div>

        <div class="card-grid">
            
            <!-- 1. إضافة حساب تاجر جديد مع مدة الأيام -->
            <div class="admin-card">
                <h3>إضافة حساب تاجر واشتراك جديد</h3>
                <input type="text" class="form-control" id="merName" placeholder="اسم المطعم">
                <input type="text" class="form-control" id="merPhone" placeholder="رقم الهاتف">
                <input type="text" class="form-control" id="merUser" placeholder="اسم المستخدم (Username)">
                <input type="text" class="form-control" id="merPass" placeholder="كلمة المرور">
                <input type="number" class="form-control" id="merDays" placeholder="مدة الاشتراك بالأيام (مثال: 30)">
                <button class="btn-action btn-green" onclick="addNewMerchantAccount()">إضافة وتفعيل حساب التاجر</button>
            </div>

            <!-- 2. عرض كل حسابات التجار المضافة ومتابعة الأيام المتبقية -->
            <div class="admin-card">
                <h3>حسابات التجار والاشتراكات</h3>
                <div id="merchantsListContainer" style="max-height: 250px; overflow-y: auto;">
                    <div class="merchant-row">
                        <div>
                            <strong>مطعم الشام</strong><br>
                            <span style="color: #e65100; font-weight: bold;">متبقي: 25 يوم</span>
                        </div>
                        <div>
                            <button onclick="alert('تعديل الاشتراكات')" style="background:#2196F3; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">تعديل</button>
                            <button onclick="this.parentElement.parentElement.remove()" style="background:#d32f2f; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">حذف</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 3. إدارة العروض والمطاعم -->
            <div class="admin-card">
                <h3>إدارة العروض وأقسام الطعام</h3>
                <input type="text" class="form-control" id="offerTitle" placeholder="اسم العرض الجديد">
                <input type="file" class="form-control" id="offerImg" accept="image/*">
                <button class="btn-action btn-green" onclick="addNewOffer()">نشر عرض في الصفحة الرئيسية</button>
            </div>

        </div>
    </div>

    <script>
        function checkLogin() {
            let u = document.getElementById('adminUser').value;
            let p = document.getElementById('adminPass').value;
            if(u === 'Jonathan' && p === '123') {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
            } else {
                alert('خطأ في البيانات! اسم المستخدم: Jonathan | كلمة المرور: 123');
            }
        }

        function addNewMerchantAccount() {
            let name = document.getElementById('merName').value;
            let phone = document.getElementById('merPhone').value;
            let user = document.getElementById('merUser').value;
            let pass = document.getElementById('merPass').value;
            let days = document.getElementById('merDays').value;

            if(!name || !user || !pass || !days) {
                alert('الرجاء تعبئة كافة الحقول المطلوبة لتسجيل التاجر!');
                return;
            }

            let container = document.getElementById('merchantsListContainer');
            container.innerHTML += `
                <div class="merchant-row">
                    <div>
                        <strong>${name}</strong> (${phone})<br>
                        <span style="color: #e65100; font-weight: bold;">متبقي: ${days} يوم</span>
                    </div>
                    <div>
                        <button onclick="alert('تعديل حساب ${name}')" style="background:#2196F3; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">تعديل</button>
                        <button onclick="this.parentElement.parentElement.remove()" style="background:#d32f2f; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">حذف</button>
                    </div>
                </div>
            `;

            alert(`تم إنشاء حساب التاجر "${name}" بنجاح، وستنتهي صلاحية حسابه تلقائياً بعد ${days} يوم!`);
            document.getElementById('merName').value = '';
            document.getElementById('merPhone').value = '';
            document.getElementById('merUser').value = '';
            document.getElementById('merPass').value = '';
            document.getElementById('merDays').value = '';
        }

        function addNewOffer() {
            let title = document.getElementById('offerTitle').value;
            if(!title) {
                alert('الرجاء كتابة اسم العرض');
                return;
            }
            alert(`تم نشر العرض "${title}" في قسم العروض بالصفحة الرئيسية بنجاح!`);
            document.getElementById('offerTitle').value = '';
            document.getElementById('offerImg').value = '';
        }
    </script>
</body>
</html>
