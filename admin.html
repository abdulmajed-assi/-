<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم المطورة - البلد فود</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary-green: #00b074; --bg-color: #f8f9fa; --white: #ffffff; --text-main: #333333; --danger: #d32f2f; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); }

        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .login-box { background: var(--white); padding: 30px; border-radius: 12px; width: 350px; text-align: center; }
        .login-box input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; }
        .login-box button { width: 100%; padding: 10px; background: var(--primary-green); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }

        .admin-container { padding: 30px 5%; display: none; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .admin-card { background: var(--white); padding: 20px; border-radius: 10px; border: 1px solid #e5e5e5; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .admin-card h3 { margin-bottom: 15px; color: var(--primary-green); font-size: 18px; border-bottom: 2px solid #eee; padding-bottom: 8px; }
        .form-control { width: 100%; padding: 9px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .btn-action { background: #333; color: white; border: none; padding: 9px 15px; border-radius: 6px; cursor: pointer; margin-top: 5px; font-weight: bold; width: 100%; }
        .btn-green { background: var(--primary-green); }
        .btn-danger { background: var(--danger); }
        .item-row { background: #f9f9f9; padding: 10px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #e5e5e5; font-size: 13px; }
    </style>
</head>
<body>

    <!-- نافذة تسجيل دخول الأدمن -->
    <div id="loginOverlay">
        <div class="login-box">
            <h2>تسجيل دخول الأدمن</h2>
            <p style="font-size: 12px; color: #777; margin: 10px 0;">اسم المستخدم: Jonathan | كلمة المرور: 123</p>
            <input type="text" id="adminUser" placeholder="اسم المستخدم">
            <input type="password" id="adminPass" placeholder="كلمة المرور">
            <button onclick="checkLogin()">دخول لوحة التحكم</button>
        </div>
    </div>

    <!-- لوحة التحكم المطورة -->
    <div class="admin-container" id="adminPanel">
        <div class="admin-header">
            <h2>لوحة التحكم المطورة (Jonathan)</h2>
            <button class="btn-action" style="width: auto; background:#2196F3;" onclick="location.href='index.html'">معاينة الموقع الرئيسي</button>
        </div>

        <div class="card-grid">
            
            <!-- 1. إضافة عرض جديد ونشره في قسم العروض بالصفحة الرئيسية -->
            <div class="admin-card">
                <h3>إضافة عرض جديد</h3>
                <input type="text" class="form-control" id="newOfferTitle" placeholder="اسم أو عنوان العرض">
                <label style="font-size: 12px; color: #666;">تحميل صورة العرض:</label>
                <input type="file" class="form-control" id="newOfferImg" accept="image/*">
                <button class="btn-action btn-green" onclick="publishNewOffer()">نشر العرض في الصفحة الرئيسية</button>
            </div>

            <!-- 2. إضافة قسم طعام مستقل (مبوب + تحميل صورة) -->
            <div class="admin-card">
                <h3>إضافة قسم طعام جديد</h3>
                <select class="form-control" id="foodCategorySelect">
                    <option value="">اختر القسم المبوب</option>
                    <option>شاورما</option>
                    <option>بروستد</option>
                    <option>سندويش غربي</option>
                    <option>فلافل</option>
                    <option>حلويات</option>
                    <option>برغر</option>
                    <option>مندي</option>
                    <option>كوكتيل</option>
                </select>
                <label style="font-size: 12px; color: #666;">تحميل صورة القسم من الكمبيوتر:</label>
                <input type="file" class="form-control" id="foodCategoryImg" accept="image/*">
                <button class="btn-action btn-green" onclick="publishFoodCategory()">إضافة القسم للموقع</button>
            </div>

            <!-- 3. إدارة، تعديل وحذف العروض القديمة والحديثة -->
            <div class="admin-card">
                <h3>إدارة وتعديل العروض القديمة</h3>
                <div id="offersManagementList" style="max-height: 220px; overflow-y: auto;">
                    <div class="item-row">
                        <span><strong>عرض العائلة المميز</strong></span>
                        <div>
                            <button onclick="editOffer(this)" style="background:#2196F3; color:white; border:none; padding:3px 6px; border-radius:4px; cursor:pointer;">تعديل</button>
                            <button onclick="this.parentElement.parentElement.remove()" style="background:#d32f2f; color:white; border:none; padding:3px 6px; border-radius:4px; cursor:pointer;">حذف</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 4. إضافة حساب تاجر مع تحديد أيام الاشتراك -->
            <div class="admin-card">
                <h3>إضافة حساب تاجر واشتراك</h3>
                <input type="text" class="form-control" id="merName" placeholder="اسم المطعم">
                <input type="text" class="form-control" id="merUser" placeholder="اسم المستخدم">
                <input type="text" class="form-control" id="merPass" placeholder="كلمة المرور">
                <input type="number" class="form-control" id="merDays" placeholder="عدد أيام الاشتراك">
                <button class="btn-action btn-green" onclick="addMerchant()">حفظ حساب التاجر</button>
            </div>

        </div>
    </div>

    <script>
        function checkLogin() {
            let u = document.getElementById('adminUser').value;
            let p = document.getElementById('adminPass').value;
            if(u === 'Jonathan' && p === '123') {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
            } else {
                alert('خطأ في البيانات! اسم المستخدم: Jonathan | كلمة المرور: 123');
            }
        }

        function publishNewOffer() {
            let title = document.getElementById('newOfferTitle').value;
            if(!title) { alert('الرجاء كتابة اسم العرض'); return; }

            let list = document.getElementById('offersManagementList');
            list.innerHTML += `
                <div class="item-row">
                    <span><strong>${title}</strong></span>
                    <div>
                        <button onclick="editOffer(this)" style="background:#2196F3; color:white; border:none; padding:3px 6px; border-radius:4px; cursor:pointer;">تعديل</button>
                        <button onclick="this.parentElement.parentElement.remove()" style="background:#d32f2f; color:white; border:none; padding:3px 6px; border-radius:4px; cursor:pointer;">حذف</button>
                    </div>
                </div>
            `;
            alert(`تم نشر العرض "${title}" بنجاح وسيظهر في قسم العروض بالصفحة الرئيسية!`);
            document.getElementById('newOfferTitle').value = '';
            document.getElementById('newOfferImg').value = '';
        }

        function publishFoodCategory() {
            let cat = document.getElementById('foodCategorySelect').value;
            if(!cat) { alert('الرجاء اختيار القسم المبوب'); return; }
            alert(`تم إضافة القسم "${cat}" بنجاح مع صورته إلى أقسام الطعام في الموقع!`);
            document.getElementById('foodCategorySelect').value = '';
            document.getElementById('foodCategoryImg').value = '';
        }

        function editOffer(btn) {
            let row = btn.parentElement.parentElement;
            let titleSpan = row.querySelector('strong');
            let newTitle = prompt('تعديل عنوان العرض:', titleSpan.innerText);
            if(newTitle) {
                titleSpan.innerText = newTitle;
                alert('تم تحديث العرض بنجاح!');
            }
        }

        function addMerchant() {
            let name = document.getElementById('merName').value;
            let days = document.getElementById('merDays').value;
            if(!name || !days) { alert('الرجاء تعبئة بيانات التاجر وأيام الاشتراك'); return; }
            alert(`تم إضافة حساب التاجر "${name}" بمدة اشتراك ${days} يوم بنجاح!`);
            document.getElementById('merName').value = '';
            document.getElementById('merUser').value = '';
            document.getElementById('merPass').value = '';
            document.getElementById('merDays').value = '';
        }
    </script>
</body>
</html>
