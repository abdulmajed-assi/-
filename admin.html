<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الفعالة - البلد فود</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary-green: #00b074; --bg-color: #f8f9fa; --white: #ffffff; --text-main: #333333; --danger: #d32f2f; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); }

        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .login-box { background: var(--white); padding: 30px; border-radius: 12px; width: 350px; text-align: center; }
        .login-box input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; }
        .login-box button { width: 100%; padding: 10px; background: var(--primary-green); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }

        .admin-container { padding: 30px 5%; display: none; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .admin-card { background: var(--white); padding: 20px; border-radius: 10px; border: 1px solid #e5e5e5; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .admin-card h3 { margin-bottom: 15px; color: var(--primary-green); font-size: 18px; border-bottom: 2px solid #eee; padding-bottom: 8px; }
        .form-control { width: 100%; padding: 9px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .btn-action { background: #333; color: white; border: none; padding: 9px 15px; border-radius: 6px; cursor: pointer; margin-top: 5px; font-weight: bold; width: 100%; }
        .btn-green { background: var(--primary-green); }
        .btn-danger { background: var(--danger); }
        .item-row { background: #f9f9f9; padding: 10px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #e5e5e5; font-size: 13px; }
    </style>
</head>
<body>

    <!-- نافذة تسجيل دخول الأدمن -->
    <div id="loginOverlay">
        <div class="login-box">
            <h2>تسجيل دخول الأدمن</h2>
            <p style="font-size: 12px; color: #777; margin: 10px 0;">اسم المستخدم: Jonathan | كلمة المرور: 123</p>
            <input type="text" id="adminUser" placeholder="اسم المستخدم">
            <input type="password" id="adminPass" placeholder="كلمة المرور">
            <button onclick="checkLogin()">دخول لوحة التحكم</button>
        </div>
    </div>

    <!-- لوحة التحكم -->
    <div class="admin-container" id="adminPanel">
        <div class="admin-header">
            <h2>لوحة تحكم الأدمن (Jonathan)</h2>
            <button class="btn-action" style="width: auto; background:#2196F3;" onclick="location.href='index.html'">معاينة الموقع الرئيسي</button>
        </div>

        <div class="card-grid">
            
            <!-- 1. إضافة مطعم جديد مع اختيار القسم ورفع الصورة من الكمبيوتر والتفاصيل -->
            <div class="admin-card">
                <h3>إضافة مطعم جديد</h3>
                <input type="text" class="form-control" id="restName" placeholder="اسم المطعم">
                <select class="form-control" id="restCategory">
                    <option value="">اختر قسم الطعام</option>
                    <option>شاورما</option>
                    <option>بروستد</option>
                    <option>سندويش غربي</option>
                    <option>فلافل</option>
                    <option>حلويات</option>
                    <option>برغر</option>
                    <option>مندي</option>
                    <option>كوكتيل</option>
                </select>
                <label style="font-size: 12px; color: #666;">تحميل صورة المطعم من الكمبيوتر:</label>
                <input type="file" class="form-control" id="restImgFile" accept="image/*">
                <textarea class="form-control" id="restDesc" placeholder="تفاصيل المطعم..." rows="2"></textarea>
                <button class="btn-action btn-green" onclick="addNewRestaurant()">نشر المطعم في القسم المحدد</button>
            </div>

            <!-- 2. إضافة عرض جديد مع رفع الصورة من الكمبيوتر واسم العرض -->
            <div class="admin-card">
                <h3>إضافة عرض جديد</h3>
                <input type="text" class="form-control" id="offerTitle" placeholder="اسم العرض">
                <label style="font-size: 12px; color: #666;">تحميل صورة العرض من الكمبيوتر:</label>
                <input type="file" class="form-control" id="offerImgFile" accept="image/*">
                <button class="btn-action btn-green" onclick="addNewOffer()">نشر العرض في قسم العروض</button>
            </div>

            <!-- 3. قائمة العناصر المضافة للتحكم بها (تعديل أو حذف) -->
            <div class="admin-card">
                <h3>إدارة العناصر المنشورة</h3>
                <div id="managedItemsList" style="max-height: 220px; overflow-y: auto;">
                    <div class="item-row">
                        <span><strong>مطعم الشام (شاورما)</strong></span>
                        <button onclick="this.parentElement.remove()" style="background:#d32f2f; color:white; border:none; padding:3px 8px; border-radius:4px; cursor:pointer;">حذف</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        function checkLogin() {
            let u = document.getElementById('adminUser').value;
            let p = document.getElementById('adminPass').value;
            if(u === 'Jonathan' && p === '123') {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
            } else {
                alert('خطأ في البيانات! اسم المستخدم: Jonathan | كلمة المرور: 123');
            }
        }

        function addNewRestaurant() {
            let name = document.getElementById('restName').value;
            let cat = document.getElementById('restCategory').value;
            let fileInput = document.getElementById('restImgFile');
            let desc = document.getElementById('restDesc').value;

            if(!name || !cat) {
                alert('الرجاء إدخال اسم المطعم واختيار قسم الطعام!');
                return;
            }

            let imageName = fileInput.files.length > 0 ? fileInput.files[0].name : 'صورة افتراضية';
            
            let list = document.getElementById('managedItemsList');
            list.innerHTML += `
                <div class="item-row">
                    <span><strong>${name}</strong> (${cat} - ${imageName})</span>
                    <button onclick="this.parentElement.remove()" style="background:#d32f2f; color:white; border:none; padding:3px 8px; border-radius:4px; cursor:pointer;">حذف</button>
                </div>
            `;
            alert(`تم إضافة المطعم "${name}" بنجاح ضمن قسم "${cat}" وسيظهر في الصفحة الرئيسية مع تفاصيله وصورته!`);
            document.getElementById('restName').value = '';
            document.getElementById('restCategory').value = '';
            document.getElementById('restImgFile').value = '';
            document.getElementById('restDesc').value = '';
        }

        function addNewOffer() {
            let title = document.getElementById('offerTitle').value;
            let fileInput = document.getElementById('offerImgFile');

            if(!title) {
                alert('الرجاء إدخال اسم العرض!');
                return;
            }

            let imageName = fileInput.files.length > 0 ? fileInput.files[0].name : 'صورة عرض';

            let list = document.getElementById('managedItemsList');
            list.innerHTML += `
                <div class="item-row">
                    <span><strong>عرض: ${title}</strong> (${imageName})</span>
                    <button onclick="this.parentElement.remove()" style="background:#d32f2f; color:white; border:none; padding:3px 8px; border-radius:4px; cursor:pointer;">حذف</button>
                </div>
            `;
            alert(`تم نشر العرض "${title}" بنجاح وسيظهر في قسم العروض بالصفحة الرئيسية!`);
            document.getElementById('offerTitle').value = '';
            document.getElementById('offerImgFile').value = '';
        }
    </script>
</body>
</html>
