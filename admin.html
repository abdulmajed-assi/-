<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الأدمن - البلد فود</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary-green: #00b074; --bg-color: #f8f9fa; --white: #ffffff; --text-main: #333333; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); }

        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .login-box { background: var(--white); padding: 30px; border-radius: 12px; width: 350px; text-align: center; }
        .login-box input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; }
        .login-box button { width: 100%; padding: 10px; background: var(--primary-green); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }

        .admin-container { padding: 30px 5%; display: none; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .admin-card { background: var(--white); padding: 20px; border-radius: 10px; border: 1px solid #e5e5e5; }
        .admin-card h3 { margin-bottom: 15px; color: var(--primary-green); }
        .form-control { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .btn-action { background: #333; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; margin-top: 5px; }
    </style>
</head>
<body>

    <!-- نافذة دخول الأدمن (Jonathan / 123) -->
    <div id="loginOverlay">
        <div class="login-box">
            <h2>تسجيل دخول الأدمن</h2>
            <p style="font-size: 12px; color: #777; margin-bottom: 15px;">اسم المستخدم: Jonathan | كلمة المرور: 123</p>
            <input type="text" id="adminUser" placeholder="اسم المستخدم">
            <input type="password" id="adminPass" placeholder="كلمة المرور">
            <button onclick="checkLogin()">دخول لوحة التحكم</button>
            <p id="errorMsg" style="color: red; font-size: 12px; margin-top: 10px;"></p>
        </div>
    </div>

    <!-- اللوحة الرئيسية للأدمن -->
    <div class="admin-container" id="adminPanel">
        <div class="admin-header">
            <h2>لوحة تحكم الأدمن - البلد فود (Jonathan)</h2>
            <button class="btn-action" onclick="location.href='index.html'">العودة للموقع الرئيسي</button>
        </div>

        <div class="card-grid">
            <!-- 1. إضافة مطعم مع اختيار كود الدولة ورقم الهاتف واسم المستخدم وكلمة السر مع إرسال عبر الواتس -->
            <div class="admin-card">
                <h3>إضافة تاجر/مطعم جديد</h3>
                <input type="text" class="form-control" id="mName" placeholder="اسم المطعم">
                <div style="display: flex; gap: 5px;">
                    <select class="form-control" id="mCode" style="width: 100px;"><option>+963</option><option>+90</option></select>
                    <input type="text" class="form-control" id="mPhone" placeholder="رقم الهاتف">
                </div>
                <input type="text" class="form-control" id="mUser" placeholder="اسم المستخدم (Username)">
                <input type="password" class="form-control" id="mPass" placeholder="كلمة السر">
                <button class="btn-action" style="background: var(--primary-green);" onclick="saveAndSendMerchant()">حفظ وإرسال الحساب عبر واتساب</button>
            </div>

            <!-- 2. إدارة الشريط العرضي (الصور والكلام المضاف عليها) -->
            <div class="admin-card">
                <h3>إدارة شريط العروض (Banner)</h3>
                <input type="text" class="form-control" placeholder="اكتب النص على الصورة">
                <input type="file" class="form-control">
                <button class="btn-action" onclick="alert('تم تحديث شريط العروض وإضافة الصورة بنجاح!')">إضافة وتحديث البانر</button>
            </div>

            <!-- 3. إضافة صورة في قسم العروض من قبل الأدمن وتظهر بنفس الحجم -->
            <div class="admin-card">
                <h3>إضافة عروض جديدة (أدمن)</h3>
                <input type="text" class="form-control" placeholder="عنوان العرض الرئيسي">
                <input type="file" class="form-control">
                <button class="btn-action" onclick="alert('تم نشر العرض في الصفحة الرئيسية!')">نشر العرض الجديد</button>
            </div>

            <!-- 4. إدارة جميع الحسابات (تمديد الاشتراك أو الحذف أو التعديل) -->
            <div class="admin-card">
                <h3>إدارة حسابات المطاعم والمشتركين</h3>
                <input type="text" class="form-control" placeholder="ابحث عن مطعم...">
                <button class="btn-action" style="background: #2196F3;" onclick="alert('تم تمديد الاشتراك 30 يوماً إضافية!')">تمديد الاشتراك 30 يوم</button>
                <button class="btn-action" style="background: #d32f2f;" onclick="alert('تم حذف المطعم وجميع عروضه بنجاح!')">حذف الحساب نهائياً</button>
            </div>
        </div>
    </div>

    <script>
        function checkLogin() {
            const user = document.getElementById('adminUser').value;
            const pass = document.getElementById('adminPass').value;
            if(user === 'Jonathan' && pass === '123') {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
            } else {
                document.getElementById('errorMsg').innerText = 'خطأ! اسم المستخدم Jonathan وكلمة المرور 123';
            }
        }

        function saveAndSendMerchant() {
            let name = document.getElementById('mName').value;
            let code = document.getElementById('mCode').value;
            let phone = document.getElementById('mPhone').value;
            let username = document.getElementById('mUser').value;
            let password = document.getElementById('mPass').value;

            if(!name || !phone || !username) {
                alert('الرجاء تعبئة الحقول الأساسية!');
                return;
            }

            let fullPhone = code + phone;
            let msg = `مرحباً بك في البلد فود يا ${name}، تم إنشاء حساب التاجر الخاص بك بنجاح.\nاسم المستخدم: ${username}\nكلمة المرور: ${password}\nيمكنك تسجيل الدخول لإضافة عروضك.`;
            
            let whatsappUrl = `https://wa.me/${fullPhone}?text=` + encodeURIComponent(msg);
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
