<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الشاملة - البلد فود</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary-green: #00b074; --bg-color: #f8f9fa; --white: #ffffff; --text-main: #333333; --danger: #d32f2f; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); }

        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .login-box { background: var(--white); padding: 30px; border-radius: 12px; width: 350px; text-align: center; }
        .login-box input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; }
        .login-box button { width: 100%; padding: 10px; background: var(--primary-green); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }

        .admin-container { padding: 30px 5%; display: none; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .admin-card { background: var(--white); padding: 20px; border-radius: 10px; border: 1px solid #e5e5e5; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .admin-card h3 { margin-bottom: 15px; color: var(--primary-green); font-size: 16px; border-bottom: 2px solid #eee; padding-bottom: 8px; }
        .form-control { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
        .btn-action { background: #333; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; margin-top: 5px; font-weight: bold; width: 100%; font-size: 13px; }
        .btn-green { background: var(--primary-green); }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <h2>تسجيل دخول الأدمن</h2>
            <p style="font-size: 12px; color: #777; margin: 10px 0;">اسم المستخدم: Jonathan | كلمة المرور: 123</p>
            <input type="text" id="adminUser" placeholder="اسم المستخدم">
            <input type="password" id="adminPass" placeholder="كلمة المرور">
            <button onclick="checkLogin()">دخول لوحة التحكم</button>
        </div>
    </div>

    <div class="admin-container" id="adminPanel">
        <div class="admin-header">
            <h2>لوحة تحكم الأدمن (Jonathan)</h2>
            <button class="btn-action" style="width: auto; background:#2196F3;" onclick="location.href='index.html'">معاينة الموقع الرئيسي</button>
        </div>

        <div class="card-grid">
            
            <!-- 1. إضافة عرض جديد مع رفع الصورة -->
            <div class="admin-card">
                <h3>1. إضافة عرض جديد</h3>
                <input type="text" class="form-control" id="offerTitle" placeholder="اسم العرض">
                <label style="font-size: 11px; color: #666;">اختر صورة العرض من الجهاز:</label>
                <input type="file" class="form-control" id="offerImgFile" accept="image/*">
                <button class="btn-action btn-green" onclick="addOffer()">نشر العرض في الصفحة الرئيسية</button>
            </div>

            <!-- 2. إضافة قسم طعام مستقل مع رفع الصورة -->
            <div class="admin-card">
                <h3>2. إضافة قسم طعام جديد</h3>
                <select class="form-control" id="foodCategory">
                    <option value="">اختر القسم المبوب</option>
                    <option>شاورما</option><option>بروستد</option><option>سندويش غربي</option>
                    <option>فلافل</option><option>حلويات</option><option>برغر</option>
                    <option>مندي</option><option>كوكتيل</option>
                </select>
                <label style="font-size: 11px; color: #666;">اختر صورة القسم من الجهاز:</label>
                <input type="file" class="form-control" id="foodImgFile" accept="image/*">
                <button class="btn-action btn-green" onclick="addFoodCategory()">إضافة القسم للموقع</button>
            </div>

            <!-- 3. إضافة حساب تاجر -->
            <div class="admin-card">
                <h3>3. إضافة حساب تاجر واشتراك</h3>
                <input type="text" class="form-control" id="merName" placeholder="اسم المطعم">
                <input type="text" class="form-control" id="merPhone" placeholder="رقم الهاتف">
                <input type="text" class="form-control" id="merUser" placeholder="اسم المستخدم">
                <input type="text" class="form-control" id="merPass" placeholder="كلمة المرور">
                <input type="number" class="form-control" id="merDays" placeholder="عدد أيام الاشتراك">
                <button class="btn-action btn-green" onclick="addMerchant()">حفظ حساب التاجر</button>
            </div>

        </div>
    </div>

    <script>
        function checkLogin() {
            let u = document.getElementById('adminUser').value;
            let p = document.getElementById('adminPass').value;
            if(u === 'Jonathan' && p === '123') {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
            } else {
                alert('خطأ في بيانات الأدمن (Jonathan / 123)');
            }
        }

        // دالة موثوقة لتحويل ملف الصورة المرفوع إلى بيانات مخزنة تظهر فوراً
        function handleImageUpload(fileInput, callback) {
            if (fileInput.files && fileInput.files[0]) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    callback(e.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                callback('https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=400');
            }
        }

        function addOffer() {
            let title = document.getElementById('offerTitle').value;
            let fileInput = document.getElementById('offerImgFile');
            if(!title) { alert('الرجاء كتابة اسم العرض'); return; }

            handleImageUpload(fileInput, function(imgData) {
                let offers = JSON.parse(localStorage.getItem('admin_offers')) || [];
                offers.push({ title: title, img: imgData });
                localStorage.setItem('admin_offers', JSON.stringify(offers));

                alert('تم نشر العرض بنجاح وستراه الآن في الصفحة الرئيسية!');
                document.getElementById('offerTitle').value = '';
                document.getElementById('offerImgFile').value = '';
            });
        }

        function addFoodCategory() {
            let cat = document.getElementById('foodCategory').value;
            let fileInput = document.getElementById('foodImgFile');
            if(!cat) { alert('الرجاء اختيار القسم المبوب'); return; }

            handleImageUpload(fileInput, function(imgData) {
                let foods = JSON.parse(localStorage.getItem('admin_foods')) || [];
                foods.push({ name: cat, img: imgData });
                localStorage.setItem('admin_foods', JSON.stringify(foods));

                alert(`تم إضافة القسم "${cat}" بنجاح وستراه الآن في أقسام الطعام بالموقع!`);
                document.getElementById('foodCategory').value = '';
                document.getElementById('foodImgFile').value = '';
            });
        }

        function addMerchant() {
            let name = document.getElementById('merName').value;
            let days = document.getElementById('merDays').value;
            if(!name || !days) { alert('الرجاء كتابة اسم المطعم ومدة الاشتراك'); return; }
            alert(`تم حفظ حساب التاجر "${name}" لمدة ${days} يوم بنجاح!`);
            document.getElementById('merName').value = '';
            document.getElementById('merPhone').value = '';
            document.getElementById('merUser').value = '';
            document.getElementById('merPass').value = '';
            document.getElementById('merDays').value = '';
        }
    </script>
</body>
</html>
